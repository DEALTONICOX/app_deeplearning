# Compila el APK de la app en la nube de GitHub (no requiere Android Studio).
# Este archivo es para cuando el repositorio contiene el PROYECTO COMPLETO (la app está en proyecto-api-vision/app-movil/).
# Si subes solo la carpeta app-movil como raíz, usa proyecto-api-vision/app-movil/.github/workflows/construir-apk.yml.
# El APK queda en Actions > (última ejecución) > Artifacts > app-reconocimiento-duoc-apk.
name: Construir APK

on:
  push:
    branches: [main]
    paths: ["proyecto-api-vision/app-movil/**", ".github/workflows/construir-apk.yml"]
  workflow_dispatch: {}

defaults:
  run:
    working-directory: proyecto-api-vision/app-movil

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proyecto-api-vision/app-movil/package-lock.json

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias y probar la conversión a matriz
        run: |
          npm ci
          npm run probar-matriz

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Asegurar la plataforma de Android 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Compilar el APK
        working-directory: proyecto-api-vision/app-movil/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: app-reconocimiento-duoc-apk
          path: proyecto-api-vision/app-movil/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
